<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>アノテーション</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; font-size: 14px; margin: 0; background: #f5f5f5; }
  #header { position: sticky; top: 0; background: #1e1e2e; color: #cdd6f4; padding: 10px 20px;
            display: flex; align-items: center; gap: 16px; z-index: 100; }
  #header h1 { margin: 0; font-size: 16px; }
  #progress-text { font-size: 13px; opacity: .8; }
  #progress-bar { flex: 1; height: 8px; background: #313244; border-radius: 4px; overflow: hidden; }
  #progress-fill { height: 100%; background: #a6e3a1; border-radius: 4px; transition: width .3s; }
  #export-btn { margin-left: auto; background: #89b4fa; color: #1e1e2e; border: none;
                padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; }
  #export-btn:hover { background: #74c7ec; }

  .card { background: #fff; margin: 16px auto; max-width: 900px; border-radius: 10px;
          box-shadow: 0 2px 8px rgba(0,0,0,.08); overflow: hidden; }
  .card-header { background: #1e1e2e; color: #cdd6f4; padding: 10px 16px;
                 display: flex; align-items: center; gap: 10px; }
  .card-header .idx { font-size: 12px; opacity: .6; }
  .card-header .repo { font-weight: bold; font-size: 14px; }
  .card-header .date { font-size: 12px; opacity: .7; margin-left: auto; }
  .card-header a { color: #89b4fa; font-size: 12px; }

  .card-body { padding: 14px 16px; }
  .section { margin-bottom: 12px; }
  .section-label { font-size: 11px; font-weight: bold; color: #888; text-transform: uppercase;
                   letter-spacing: .05em; margin-bottom: 4px; }
  .commit-msg { background: #f0f4ff; border-left: 3px solid #89b4fa; padding: 8px 10px;
                border-radius: 0 6px 6px 0; font-size: 13px; white-space: pre-wrap; }
  pre { background: #1e1e2e; color: #cdd6f4; padding: 12px; border-radius: 6px;
        overflow-x: auto; font-size: 12px; line-height: 1.5; margin: 0; white-space: pre; }
  .added-comment { background: #d4f7d4; border-left: 3px solid #a6e3a1; padding: 8px 10px;
                   border-radius: 0 6px 6px 0; font-size: 13px; white-space: pre-wrap; font-family: monospace; }
  .meta-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: #555; }
  .meta-item { background: #f0f0f0; padding: 3px 8px; border-radius: 4px; }
  .meta-item.highlight { background: #fef3c7; color: #92400e; }

  .issue-box { background: #fff8f0; border: 1px solid #fde68a; border-radius: 6px; padding: 10px 12px; }
  .issue-box .issue-title { font-weight: bold; font-size: 13px; margin-bottom: 6px; }
  .issue-body { font-size: 12px; white-space: pre-wrap; max-height: 200px; overflow-y: auto;
                border-top: 1px solid #fde68a; margin-top: 6px; padding-top: 6px; }
  .lang-toggle { font-size: 11px; color: #89b4fa; cursor: pointer; margin-left: 8px; }

  .label-row { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
               background: #fafafa; border-top: 1px solid #eee; }
  .label-row span { font-size: 13px; font-weight: bold; color: #444; }
  .label-btn { border: 2px solid #ddd; background: #fff; padding: 6px 18px; border-radius: 20px;
               cursor: pointer; font-size: 14px; font-weight: bold; transition: all .15s; }
  .label-btn:hover { border-color: #89b4fa; }
  .label-btn.selected-1 { background: #a6e3a1; border-color: #40a02b; color: #213c15; }
  .label-btn.selected-0 { background: #f38ba8; border-color: #d20f39; color: #4a0010; }
  .label-btn.selected-q { background: #fab387; border-color: #fe640b; color: #4a1800; }
  .notes-input { flex: 1; border: 1px solid #ddd; border-radius: 6px; padding: 6px 10px;
                 font-size: 13px; min-width: 0; }
</style>
</head>
<body>
<div id="header">
  <h1>コメントのみコミット アノテーション</h1>
  <div id="progress-text">0 / 100 件完了</div>
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
  <button id="export-btn" onclick="exportCSV()">CSVに書き出す</button>
</div>

<div id="cards"></div>

thub.io/webappsec-fetch-metadata/\">{@code Sec-Fetch-Mode}</a>\n   * header field name.\n---\n   * The HTTP <a href=\"https://w3c.github.io/webappsec-fetch-metadata/\">{@code Sec-Fetch-Site}</a>\n   * header field name.\n---\n   * The HTTP <a href=\"https://w3c.github.io/webappsec-fetch-metadata/\">{@code Sec-Fetch-User}</a>\n   * header field name.\n---\n   * The HTTP <a href=\"https://w3c.github.io/webappsec-fetch-metadata/\">{@code Sec-Metadata}</a>\n   * header field name.", "added_comment_ja": "* HTTP <a href=\"https://w3c.github.io/webappsec-fetch-metadata/\">{@code Sec-Fetch-Dest}</a>\n   * ヘッダーフィールド名。\n---\n   * HTTP <a href=\"https://w3c.github.io/webappsec-fetch-metadata/\">{@code Sec-Fetch-Mode}</a>\n   * ヘッダーフィールド名。\n---\n   * HTTP <a href=\"https://w3c.github.io/webappsec-fetch-metadata/\">{@code Sec-Fetch-Site}</a>\n   * ヘッダーフィールド名。\n---\n   * HTTP <a href=\"https://w3c.github.io/webappsec-fetch-metadata/\">{@code Sec-Fetch-User}</a>\n   * ヘッダーフィールド名。\n---\n   * HTTP <a href=\"https://w3c.github.io/webappsec-fetch-metadata/\">{@code Sec-Metadata}</a>\n   * ヘッダーフィールド名。", "target_method": "  private HttpHeaders() {}\n", "issue": null}, {"index": 15, "label": "", "notes": "", "github_url": "https://github.com/google/guava/commit/106948459ac6dc6dfc5d3053639b47e0dc4e8745", "repo": "google/guava", "commit_date": "2019-04-12", "commit_message": "Update GraphBuilder documentation with option of building an immutable graph\n\nRELNOTES=n/a\n\n-------------\nCreated by MOE: https://github.com/google/moe\nMOE_MIGRATED_REVID=242879149", "commit_message_ja": "不変グラフを構築するオプションを追加して GraphBuilder ドキュメントを更新\n\nRELNOTES=n/a\n\n-------------\n環境省作成：https://github.com/google/moe\nMOE_MIGRATED_REVID=242879149", "is_different_author": "-1", "time_gap_days": "", "file_path": "GraphBuilder.java", "target_class": "", "comment_type": "inline", "added_comment": " * A builder for constructing instances of {@link MutableGraph} or {@link ImmutableGraph} with\n * user-defined properties.\n---\n * <p>Examples of use:\n---\n * // Building a mutable graph\n---\n *\n * // Building an immutable graph\n * ImmutableGraph<String> immutableGraph =\n *     GraphBuilder.undirected()\n *         .allowsSelfLoops(true)\n *         .<String>immutable()\n *         .putEdge(\"bread\", \"bread\")\n *         .putEdge(\"chocolate\", \"peanut butter\")\n *         .putEdge(\"peanut butter\", \"jelly\")\n *         .build();", "added_comment_ja": "* {@link MutableGraph} または {@link ImmutableGraph} のインスタンスを構築するためのビルダー\n * ユーザー定義のプロパティ。\n---\n * <p>使用例:\n---\n * // 変更可能なグラフを構築する\n---\n *\n * // 不変のグラフを構築する\n * ImmutableGraph<String> immutableGraph =\n * GraphBuilder.undirected()\n * .allowsSelfLoops(true)\n * .<String>immutable()\n * .putEdge(\"パン\", \"パン\")\n * .putEdge(\"チョコレート\", \"ピーナッツバター\")\n * .putEdge(\"ピーナッツバター\", \"ゼリー\")\n * .build();", "target_method": "", "issue": null}, {"index": 16, "label": "", "notes": "", "github_url": "https://github.com/bazelbuild/bazel/commit/f596485c28306d2f89519e6b9e88ee16fe05a8a6", "repo": "bazelbuild/bazel", "commit_date": "2023-11-22", "commit_message": "Clarify the purpose and overall behavior of RemoteActionFileSystem.\n\nPiperOrigin-RevId: 584679218\nChange-Id: I535fa24c3429285f393278e48e13327c8c52b0c3", "commit_message_ja": "RemoteActionFileSystem の目的と全体的な動作を明確にします。\n\nPiperOrigin-RevId: 584679218\n変更 ID: I535fa24c3429285f393278e48e13327c8c52b0c3", "is_different_author": "-1", "time_gap_days": "", "file_path": "RemoteActionFileSystem.java", "target_class": "", "comment_type": "inline", "added_comment": " * An action filesystem suitable for use when building with remote caching or execution.\n---\n * <p>It acts as a union filesystem over three different sources:\n---\n * <ul>\n *   <li>The action input map, providing read-only in-memory access to the metadata (but not the\n *       contents) of the action's declared inputs.\n *   <li>The remote output tree, an in-memory filesystem providing read/write access to the metadata\n *       (but not the contents) of remotely stored files injected during action execution.\n *   <li>The local filesystem, providing read/write access to the metadata and contents of files\n *       residing on disk, including the inputs and outputs of local spawns.\n * </ul>\n *\n * <p>Generally speaking, file operations consult the underlying sources in that order and operate\n * on the first result found, although some (e.g. readdir) collate information from all sources. The\n * contents of remotely stored files are transparently downloaded when an operation requires them.\n *\n * <p>Special care must be taken with operations that follow symlinks, as the symlink and its target\n * path may reside on different sources, with an arbitrary number of indirections in between. This\n * is required because some actions (notably SymlinkAction) may materialize an output as a symlink\n * to an input. Most operations call resolveSymbolicLinks upfront (which is able to canonicalize\n * paths taking every source into account) and only then delegate to the underlying sources.\n *\n * <p>The implementation assumes that an action never modifies its input files, but may otherwise\n * modify any path in the output tree, including modifications that undo previous ones (e.g.,\n * writing to a path and then moving it elsewhere). No effort is made to detect irreconcilable\n * differences between sources (e.g., distinct files of the same name in two different sources).", "added_comment_ja": "* リモート キャッシュまたは実行を使用してビルドする場合の使用に適したアクション ファイルシステム。\n---\n * <p>これは、3 つの異なるソースにわたるユニオン ファイルシステムとして機能します。\n---\n * <ul>\n * <li>アクション入力マップ。メタデータへの読み取り専用のメモリ内アクセスを提供します (ただし、\n * コンテンツ) アクションの宣言された入力。\n * <li>リモート出力ツリー、メタデータへの読み取り/書き込みアクセスを提供するメモリ内ファイルシステム\n * アクションの実行中に挿入された、リモートに保存されたファイル (内容は除く)。\n * <li>ローカル ファイル システム。ファイルのメタデータとコンテンツへの読み取り/書き込みアクセスを提供します。\n * ローカルスポーンの入力と出力を含む、ディスク上に常駐します。\n * </ul>\n *\n * <p>一般に、ファイル操作はこの順序で基礎となるソースを参照して操作します。\n * 一部 (例: readdir) はすべてのソースからの情報を照合しますが、最初に見つかった結果に基づいています。の\n * リモートに保存されたファイルの内容は、操作で必要な場合に透過的にダウンロードされます。\n *\n * <p>シンボリックリンクとそのターゲットとして、シンボリックリンクをたどる操作には特別な注意が必要です\n * パスは、間に任意の数の間接指定を挟んで、異なるソース上に存在する場合があります。これ\n 一部のアクション (特に SymlinkAction) は出力をシンボリックリンクとして具体化する可能性があるため、* は必須です\n * を入力に。ほとんどの操作は、resolveSymbolicLinks を前もって呼び出します (これにより正規化が可能です)。\n * すべてのソースを考慮したパス)、その後でのみ基礎となるソースに委任します。\n *\n * <p>実装では、アクションが入力ファイルを変更しないことを前提としていますが、そうでない場合は変更される可能性があります。\n * 出力ツリー内の任意のパスを変更します。これには、以前のパスを元に戻す変更も含まれます (例:\n * パスに書き込んでから、それを別の場所に移動します)。相容れないものを検出する努力は一切行われない\n * ソース間の差異 (例: 2 つの異なるソースにある同じ名前の個別のファイル)。", "target_method": "", "issue": null}, {"index": 17, "label": "", "notes": "", "github_url": "https://github.com/openjdk/jdk/commit/e44ef0c32b3c2fcd0a6293838d9185b6d0719219", "repo": "openjdk/jdk", "commit_date": "2025-10-01", "commit_message": "8367704: Fix minor documentation issues in java.time.**\n\nReviewed-by: naoto, rriggs", "commit_message_ja": "8367704: java.time.** のドキュメントに関する軽微な問題を修正\n\nレビュー者: ナオト、リッグス", "is_different_author": "-1", "time_gap_days": "", "file_path": "Duration.java", "target_class": "", "comment_type": "inline", "added_comment": "     * where each day is 86,400 seconds which implies a 24 hour day.\n---\n     * where each hour is 3,600 seconds.\n---\n     *    \"PT10H\"     -- parses as \"10 hours\" (where an hour is 3,600 seconds)\n     *    \"P2D\"       -- parses as \"2 days\" (where a day is 24 hours or 86,400 seconds)\n---\n     * To guarantee a positive duration, call {@link #abs()} on the result.\n---\n     * The number of days is multiplied by 86,400 to obtain the number of seconds to add.\n---\n     * The number of days is multiplied by 86,400 to obtain the number of seconds to subtract.\n---\n     * The number of hours is multiplied by 3,600 to obtain the number of seconds to subtract.\n---\n     * The number of minutes is multiplied by 60 to obtain the number of seconds to subtract.\n---\n     * number of seconds by 86,400.\n---\n     * number of seconds by 3,600.\n---\n 関連する javadoc の説明を更新し、明確化を追加しました。\n\nレビュー者: ムーラン", "is_different_author": "-1", "time_gap_days": "", "file_path": "ClassLoader.java", "target_class": "", "comment_type": "inline", "added_comment": " * Copyright (c) 1994, 2010, Oracle and/or its affiliates. All rights reserved.\n---\n * method. Note that the <tt>ClassLoader</tt> class is registered as parallel\n * capable by default. However, its subclasses still need to register themselves\n * if they are parallel capable. <br>\n * In environments in which the delegation model is not strictly\n * hierarchical, class loaders need to be parallel capable, otherwise class\n---\n     * Registers the caller as parallel capable.</p>\n     * The registration succeeds if and only if all of the following\n     * conditions are met: <br>\n     * 1. no instance of the caller has been created</p>\n     * 2. all of the super classes (except class Object) of the caller are\n     * registered as parallel capable</p>\n     * Note that once a class loader is registered as parallel capable, there\n     * is no way to change it back. </p>", "added_comment_ja": "* 著作権 (c) 1994、2010、Oracle および/またはその関連会社。無断転載を禁じます。\n - -\n * 方法。 <tt>ClassLoader</tt> クラスが並列として登録されていることに注意してください。\n * デフォルトで有効です。ただし、そのサブクラスは依然として自身を登録する必要があります\n * 並列対応の場合。 <br>\n * 委任モデルが厳密ではない環境では\n * 階層型、クラスローダーは並列対応である必要があり、それ以外の場合はクラス\n---\n     * 呼び出し元を並列対応として登録します。</p>\n     * 登録は、次のすべての条件が満たされた場合にのみ成功します。\n     * 条件が満たされています: <br>\n     * 1. 呼び出し元のインスタンスは作成されていません</p>\n     * 2. 呼び出し元のすべてのスーパークラス（クラス Object を除く）は、\n     * 並列対応として登録</p>\n     * クラスローダーが並列対応として登録されると、\n     * を元に戻す方法はありません。 </p>", "target_method": "", "issue": null}, {"index": 51, "label": "", "notes": "", "github_url": "https://github.com/apache/jmeter/commit/e9a89b9097b1229f9b9e83eadcf46233095e8d88", "repo": "apache/jmeter", "commit_date": "2010-02-08", "commit_message": "Javadoc clarification\n\ngit-svn-id: https://svn.apache.org/repos/asf/jakarta/jmeter/trunk@907679 13f79535-47bb-0310-9956-ffa450edef / SAK.\n        // NOTE: Tags might not appear to be genuine/valid NXP/Infinion tags.\n        // For a 4b UID/1k MFC tag the SAK should be 0x08 but the \"corresponding\" byte in\n        // block 0 (byte nr. 5) must by 0x88. This is not possible with some gen2 tags,\n        // because they use byte nr. 5 as SAK value.\n        String sak = null;\n        if (tagSize == MifareClassic.SIZE_MINI) {\n            sak = \"09\";\n        } else if (tagSize == MifareClassic.SIZE_1K || tagSize == MifareClassic.SIZE_2K) {\n            sak = \"08\";\n        } else if (tagSize == MifareClassic.SIZE_4K) {\n            sak = \"18\";\n        }\n\n        if (sak == null || atqa == null) {\n... (省略: 全44行)", "issue": null}, {"index": 54, "label": "", "notes": "", "github_url": "https://github.com/material-components/material-components-android/commit/0eb5c1ae7509e9a973c703ee38e30afd05d907e1", "repo": "material-components/material-components-android", "commit_date": "2018-04-30", "commit_message": "Fix typo in ChipDrawable documentation s/getIntrinsicWidth/getIntrinsicHeight\n\nPiperOrigin-RevId: 193965067", "commit_message_ja": "ChipDrawable ドキュメント s/getIntrinsicWidth/getIntrinsicHeight のタイプミスを修正\n\nPiperOrigin-RevId: 193965067", "is_different_author": "-1", "time_gap_days": "", "file_path": "ChipDrawable.java", "target_class": "", "comment_type": "inline", "added_comment": " *       ChipDrawable#getIntrinsicHeight()} and {@link ChipDrawable#getIntrinsicWidth()}.", "added_comment_ja": "* ChipDrawable#getIntrinsicHeight()} および {@link ChipDrawable#getIntrinsicWidth()}。", "target_method": "", "issue": null}, {"index": 55, "label": "", "notes": "", "github_url": "https://github.com/camunda/camunda/commit/491f08171b1884d7dac7bf0451366d4d298d28b8", "repo": "camunda/camunda", "commit_date": "2020-10-12", "commit_message": "chore(atomix): document explicit flushes", "commit_message_ja": "chore(atomix): 明示的なフラッシュを文書化する", "is_different_author": "-1", "time_gap_days": "", "file_path": "Raf ests as @Tag(\"multi-db-test\"), otherwise tests are not executed in multi db fashion.</b>\n * This is per default done by the {@link MultiDbTest} annotation.\n *\n *  <pre>{@code\n *  @Tag(\"multi-db-test\")\n *  final class MyAuthMultiDbTest {\n *\n *    static final TestStandaloneBroker BROKER =\n *        new TestStandaloneBroker().withBasicAuth().withAuthorizationsEnabled();\n *\n *    @RegisterExtension\n *    static final CamundaMultiDBExtension EXTENSION = new CamundaMultiDBExtension(BROKER);\n *\n *    private static final String ADMIN = \"admin\";\n *\n *    @UserDefinition\n *    private static final User ADMIN_USER =\n *      new User(ADMIN,\n *               \"password\",\n *               List.of(new Permissions(AUTHORIZATION, PermissionTypeEnum.READ, List.of(\"*\"))));\n *\n *    @Test\n *    void shouldMakeUseOfClient(@Authenticated(ADMIN) final CamundaClient adminClient) {\n *      // given\n *      // ... set up\n *\n *      // when\n *      topology = adminClient.newTopologyRequest().send().join();\n *\n *      // then\n *      assertThat(topology.getClusterSize()).isEqualTo(1);\n *    }\n *  }</pre>\n *\n *  As we can see there are further possibilities with the extension, like defining users with\n *  annotated {@link UserDefinition}. This allows the extension to pick up the users, and create\n *  them on client usage. Furthermore, authenticated clients are supported with this as well.\n *\n * The following code will inject a client, as parameter, that is authenticated with the ADMIN\n * user.\n * <pre>{@code\n * @Test\n * void shouldMakeUseOfClient(@Authenticated(ADMIN) final CamundaClient adminClient) {\n * </pre>\n *\n *\n *\n---\n * org.junit.jupiter.api.TestTemplate} or {@link CamundaMultiDbExtension}. When applied, this\n * indicates that the {@link CamundaClient} should be created with the provided user's credentials.", "added_comment_ja": "* これは、たとえば認証テストに必要です。\n *\n * <b>必ずタグを付ける必要があります。\n * 対応するテストは @Tag(\"multi-db-test\") として指定されます。それ以外の場合、テストはマルチ データベース形式で実行されません。</b>\n * これはデフォルトで、{@link MultiDbTest} アノテーションによって行われます。\n *\n * <pre>{@code\n * @Tag(\"マルチデータベーステスト\")\n * 最終クラス MyAuthMultiDbTest {\n *\n * 静的最終 TestStandaloneBroker BROKER =\n * 新しい TestStandaloneBroker().withBasicAuth().withAuthorizationsEnabled();\n *\n * @RegisterExtension\n * 静的最終 CamundaMultiDBExtension EXTENSION = new CamundaMultiDBExtension(BROKER);\n *\n * プライベート静的最終文字列 ADMIN = \"管理者\";\n *\n * @ユーザー定義\n * プライベート静的最終ユーザー ADMIN_USER =\n * 新しいユーザー(ADMIN、\n * 「パスワード」、\n * List.of(new Permissions(AUTHORIZATION, PermissionTypeEnum.READ, List.of(\"*\"))));\n *\n * @テスト\n * void shouldMakeUseOfClient(@Authenticated(ADMIN) Final CamundaClient adminClient) {\n * // 与えられた\n * // ... セットアップ\n *\n * // とき\n * トポロジー = adminClient.newTopologyRequest().send().join();\n *\n * // その後\n *assertThat(topology.getClusterSize()).isEqualTo(1);\n * }\n * }</pre>\n *\n * ご覧のとおり、この拡張機能にはさらに可能性があります。たとえば、次のようにユーザーを定義します。\n * 注釈付き {@link UserDefinition}。これにより、拡張機能がユーザーを選択し、\n * クライアントの使用状況に応じて異なります。さらに、認証されたクライアントもこれでサポートされます。\n *\n * 次のコードは、ADMIN で認証されたクライアントをパラメータとして挿入します。\n * ユーザー。\n * <pre>{@code\n * @テスト\n * void shouldMakeUseOfClient(@Authenticated(ADMIN) Final CamundaClient adminClient) {\n * </pre>\n *\n *\n *\n---\n * org.junit.jupiter.api.TestTemplate} または {@link CamundaMultiDbExtension}。これを適用すると、\n * は、指定されたユーザーの認証情報を使用して {@link CamundaClient} を作成する必要があることを示します。", "target_method": "", "issue": null}, {"index": 78, "label": "", "notes": "", "github_url": "https://github.com/conductor-oss/conductor/commit/855a302b525a3a9271c9f903ce8eb76bb7555f07", "repo": "conductor-oss/conductor", "commit_date": "2018-06-28", "commit_message": "grpc: Document the ProtoMapper methods", "commit_message_ja": "grpc: ProtoMapper メソッドを文書化する", "is_different_author": "-1", "time_gap_days": "", "file_path": "ProtoMapper.java", "target_class": "", "comment_type": "javadoc", "added_comment": "/**\n * ProtoMapper implements conversion code between the internal models\n * used by Conductor (POJOs) and their corresponding equivalents in\n * the exposed Protocol Buffers interface.\n *\n * The vast majority of the mapping logic is implemented in the autogenerated\n * {@link AbstractProtoMapper} class. This class only implements the custom\n * logic for objects that need to be special cased in the API.\n */\n---\n    /**\n     * Convert an {@link Object} instance into its equivalent {@link Value}\n     * ProtoBuf object.\n     *\n     * The {@link Value} ProtoBuf message is a variant type that can define any\n     * value representable as a native JSON type. Consequently, this method expects\n     * the given {@link Object} instance to be a Java object instance of JSON-native\n     * value, namely: null, {@link Boolean}, {@link Double}, {@link String},\n     * {@link Map<String, Object>}, {@link List<Object>}.\n     *\n     * Any other values will cause an exception to be thrown.\n     * See {@link ProtoMapper#fromProto(Value)} for the reverse mapping.\n     *\n     * @param val a Java object that can be represented natively in JSON\n     * @return an instance of a {@link Value} ProtoBuf message\n     */\n---\n    /**\n     * Convert a ProtoBuf {@link Value} message into its native Java object\n     * equivalent.\n     *\n     * See {@link ProtoMapper#toProto(Object)} for the reverse mapping and the\n     * possible values that can be returned from this method.\n     *\n     * @param any an instance of a ProtoBuf {@link Value} message\n     * @return a native Java object representing the value\n     */\n---\n    /**\n     * Convert a WorkflowTaskList message wrapper into a {@link List} instance\n     * with its contents.\n     *\n     * @param list an instance of a ProtoBuf message\n     * @return a list with the contents of the message\n     */\n---\n    /**\n     * Convert a list of {@link WorkflowTask} instances into a ProtoBuf wrapper object.\n     *\n     * @param list a list of {@link WorkflowTask} instances\n     * @return a ProtoBuf message wrapping the contents of the list\n     */", "added_comment_ja": "/**\n * ProtoMapperは内部モデル間の変換コードを実装します\n * Conductor (POJO) およびそれに対応する同等物によって使用されます。\n * 公開されたプロトコル バッファー インターフェイス。\n *\n * マッピング ロジックの大部分は、自動生成された\n * {@link AbstractProtoMapper} クラス。このクラスはカスタムのみを実装します。\n * API で特殊なケースを使用する必要があるオブジェクトのロジック。\n */\n---\n    /**\n     * {@link Object} インスタンスを同等の {@link Value} に変換します\n     * ProtoBuf オブジェクト。\n     *\n     * {@link Value} ProtoBuf メッセージは、任意の値を定義できるバリアント型です。\n     * ネイティブ JSON タイプとして表現できる値。したがって、このメソッドが期待するのは、\n     * 指定された {@link Object} インスタンスは JSON ネイティブの Java オブジェクト インスタンスになります\n     * 値、つまり: null、{@link Boolean}、{@link Double}、{@link String}、\n     * {@link Map<String, Object>}、{@link List<Object>}。\n     *\n     * 他の値を指定すると、例外がスローされます。\n     * 逆マッピングについては、{@link ProtoMapper#fromProto(Value)} を参照してください。\n     *\n     * @param val JSON でネイティブに表現できる Java オブジェクト\n     * @return {@link Value} ProtoBuf メッセージのインスタンス\n     */\n---\n    /**\n     * ProtoBuf {@link Value} メッセージをネイティブ Java オブジェクトに変換します\n     *同等。\n     *\n     * 逆マッピングについては {@link ProtoMapper#toProto(Object)} を参照してください。\n     * このメソッドから返される可能性のある値。\n     *\n     * @param ProtoBuf {@link Value} メッセージのインスタンス\n     * @return 値を表すネイティブ Java オブジェクト\n     */\n---\n    /**\n     * WorkflowTaskList メッセージ ラッパーを {@link List} インスタンスに変換します\n     *その内容とともに。\n     *\n     * @param は ProtoBuf メッセージのインスタンスをリストします\n     * @return メッセージの内容を含むリスト\n     */\n---\n    /**\n     * {@link WorkflowTask} インスタンスのリストを ProtoBuf ラッパー オブジェクトに変換します。\n     *\n     * @param list {@link WorkflowTask} インスタンスのリスト\n     * @return リストの内容をラップする ProtoBuf メッセージ\n     */", "target_method": "", "issue": null}, {"index": 79, "label": "", "notes": "", "github_url": "https://github.com/objectbox/objectbox-java/commit/f61eb8bf40175ea21aedf2746c1435609a946567", "repo": "objectbox/objectbox-java", "commit_date": "2024-06-03", "commit_message": "ToMany: update add, remove and get methods, note important details", "commit_message_ja": "ToMany: 追加、削除、および取得メソッドを更新し、重要な詳細をメモします", "is_different_author": "-1", "time_gap_days": "", "file_path": "ToMany.java", "target_class": "ToMany", "comment_type": "inline", "added_comment": "     * Prepares to add the given target object to this relation.\n     * <p>\n     * To apply changes, call {@link #applyChangesToDb()} or put the object with the ToMany. For important details, see\n     * the notes about relations of {@link Box#put(Object)}.\n---\n     * Gets the target object at the given index.\n     * <p>\n     * {@link ToMany} uses lazy initialization, so on first access this will read the target objects from the database.\n---\n    /**\n     * Like {@link #remove(Object)}, but using the location of the target object.\n     */\n---\n    /**\n     * Prepares to remove the target object from this relation.\n     * <p>\n     * To apply changes, call {@link #applyChangesToDb()} or put the object with the ToMany. For important details, see\n     * the notes about relations of {@link Box#put(Object)}.\n     */\n---\n    /**\n     * Like {@link #remove(Object)}, but using just the ID of the target object.\n     */", "added_comment_ja": "* 指定されたターゲット オブジェクトをこのリレーションに追加する準備をします。\n     *<p>\n     * 変更を適用するには、{@link #applyChangesToDb()} を呼び出すか、オブジェクトを ToMany に置きます。重要な詳細については、を参照してください。\n     * {@link Box#put(Object)}の関係についてのメモ。\n---\n     * 指定されたインデックスにあるターゲット オブジェクトを取得します。\n     *<p>\n     * {@link ToMany} は遅延初期化を使用するため、最初のアクセス時にデータベースからターゲット オブジェクトを読み取ります。\n---\n    /**\n     * {@link #remove(Object)} と似ていますが、ターゲット オブジェクトの場所を使用します。\n     */\n---\n    /**\n     * このリレーションからターゲット オブジェクトを削除する準備をします。\n     *<p>\n     * 変更を適用するには、{@link #applyChangesToDb()} を呼び出すか、オブジェクトを ToMany に置きます。重要な詳細については、を参照してください。\n     * {@link Box#put(Object)}の関係についてのメモ。\n     */\n---\n    /**\n     * {@link #remove(Object)} と似ていますが、ターゲット オブジェクトの ID のみを使用します。\n     */", "target_method": "    private void ensureEntities() {\n        if (entities == null) {\n            long id = relationInfo.sourceInfo.getIdGetter().getId(entity);\n            if (id == 0) {\n                // Not yet persisted entity\n                synchronized (this) {\n                    if (entities == null) {\n                        entities = getListFactory().createList();\n                    }\n                }\n            } else {\n                ensureBoxes();\n                List<TARGET> newEntities;\n                int relationId = relationInfo.relationId;\n                if (relationId != 0) {\n                    int sourceEntityId = relationInfo.sourceInfo.getEntityId();\n                    newEntities = targetBox.internalGetRelationEntities(sourceEntityId, relationId, id, false);\n                } else {\n                    if (relationInfo.targetIdProperty != null) {\n                        // Backlink from ToOne\n                        newEntities = targetBox.internalGetBacklinkEntities(relationInfo.targetInfo.getEntityId(),\n                                relationInfo.targetIdProperty, id);\n                    } else {\n                        // Backlink from ToMany\n                        newEntities = targetBox.internalGetRelationEntities(relationInfo.targetInfo.getEntityId(),\n                                relationInfo.targetRelationId, id, true);\n                    }\n                }\n                if (comparator != null) {\n                    Collections.sort(newEntities, comparator);\n                }\n                synchronized (this) {\n                    if (entities == null) {\n                        entities = newEntities;\n                    }\n                }\n            }\n        }\n    }", "issue": null}, {"index": 80, "label": "", "notes": "", "github_url": "https://github.com/camunda/camunda/commit/078ca45a93cb6ae87728998b4cf3b425bf72133a", "repo": "camunda/camunda", "commit_date": "2022-09-20", "commit_message": "docs(engine): add explaining comment\n\nExplains why the reason is left empty in the event of an ExceededBatchRecordSizeException.", "commit_message_ja": "docs(engine): 説明コメントを追加\n\nExceededBatchRecordSizeException のイベントで理由が空のままになる理由を説明します。", "is_different_author": "-1", "time_gap_days": "", "file_path": "Engine.java", "target_class": "Engine", "comment_type": "inline", "added_comment": "      // Rejection reason is left empty here. This is because we need to make sure we can write the\n      // rejection. The record itself does not exceed the batch record size, but adding a reason\n      // could cause it to cross the limit. When this happens the engine would reach an\n      // exception-loop.", "added_comment_ja": "// 拒否理由はここでは空のままです。これは、次のように記述できることを確認する必要があるためです。\n      // 拒否。レコード自体はバッチレコードサイズを超えていないが、理由を追加する\n      // 制限を超える可能性があります。これが起こると、エンジンは次の状態に達します。\n      // 例外ループ。", "target_method": "  public void replay(final TypedRecord event) {\n    eventApplier.applyState(event.getKey(), event.getIntent(), event.getValue());\n  }", "issue": null}, {"index": 81, "label": "", "notes": "", "github_url": "https://github.com/openjdk/jdk/commit/a165ef39c63c26f896914a6452859fd4e2ef4f17", "repo": "openjdk/jdk", "commit_date": "2019-05-21", "commit_message": "8183273: Clarify Instrumentation interface should not be implemented outside java.instrument module\n\nAdd a note with a clarification\n\nReviewed-by: alanb, dholmes, jcbeyler", "commit_message_ja": "8183273：Clarify Instrumentation インターフェイスは java.instrument モジュールの外部に実装すべきではありません\n\n説明を含むメモを追加する\n\nレビュー者: alanb、dholmes、jcbeyler", "is_different_author": "-1", "time_gap_days": "", "file_path": "Instrumentation.java", "target_class": "", "comment_type": "inline", "added_comment": " * Copyright (c) 2003, 2019, Oracle and/or its affiliates. All rights reserved.\n---\n * <p>\n * @apiNote This interface is not intended to be implemented outside of\n * the java.instrument module.", "added_comment_ja": "* 著作権 (c) 2003、2019、Oracle および/またはその関連会社。無断転載を禁じます。\n---\n *<p>\n * @apiNote このインターフェイスは、外部で実装することを目的としていません。\n * java.instrument モジュール。", "target_method": "", "issue": null}, {"index": 82, "label": "", "notes": "", "github_url": "https://github.com/gephi/gephi/commit/8894bb65296e9add575c3a6b2507331de388ab88", "repo": "gephi/gephi", "commit_date": "2010-10-04", "commit_message": "Processor documentation.", "commit_message_ja": "プロセッサーのドキュメント。", "is_different_author": "-1", "time_gap_days": "", "file_path": "AppendProcessor.java", "target_class": "", "comment_type": "inline", "added_comment": " * Processor 'Append graph' that tries to find in the current workspace nodes and\n * edges in the container to only append new elements. It uses elements' id and\n * label to do the matching.\n * <p>\n * The attibutes are not merged and values are from the latest element imported.\n *\n---\n * Processor 'Add full graph' that unloads the complete container into the\n * workspace.\n *\n---\n * Processor 'Time Frame' that uses its 'date' parameter to associate the content\n * of the container to a particular point in time. It locates and modify existing\n * elements by appending new time intervals. It also create dynamic attribute\n * values, as well as a dynamic weight.", "added_comment_ja": "* 現在のワークスペース ノード内で検索を試みるプロセッサ「グラフの追加」と\n * 新しい要素のみを追加するコンテナ内のエッジ。要素の ID を使用し、\n * マッチングを行うためのラベル。\n *<p>\n * 属性はマージされず、値はインポートされた最新の要素からのものです。\n *\n---\n * プロセッサー「完全なグラフを追加」。完全なコンテナーを\n * ワークスペース。\n *\n---\n * 「日付」パラメータを使用してコンテンツを関連付けるプロセッサ「タイム フレーム」\n * コンテナーの特定の時点までのデータ。既存の場所を見つけて変更します\n * 新しい時間間隔を追加して要素を作成します。動的属性も作成します\n * 値と動的な重み。", "target_method": "", "issue": null}, {"index": 83, "label": "", "notes": "", "github_url": "https://github.com/google/ExoPlayer/commit/31e69d2daca143326d9fbf907fb1695a3a31b6d8", "repo": "google/ExoPlayer", "commit_date": "2022-08-19", "commit_message": "MediaSession.Callback: Document an example when onAddMediaItems is called.", "commit_message_ja": "MediaSession.Callback: onAddMediaItems が呼び出されるときの例を文書化します。", "is_different_author": "-1", "time_gap_days": "", "file_path": "Media d softPauseExporting is called, the exporter will be soft\n   * paused.\n   */\n---\n  /**\n   * This method enables us to resume the exporting of records after it has been paused. It works\n   * both to resume the \"soft pause\" state and the \"paused\" state. Upon resuming, the exporter is\n   * updated with the position and metadata of the last exported record.\n   */\n---\n// The PAUSED phase is when the exporter is paused, and the exporter is not exporting records.\n// The SOFT_PAUSED phase is when we keep exporting the records without updating the exporter state.", "added_comment_ja": "/**\n   * この方法では、レコードのエクスポートを一時停止できます。再開するまでレコードはエクスポートされません\n   * エクスポートが呼び出されます。\n   *\n   * <p>エクスポーターがソフト一時停止されていて、pauseExporting が呼び出された場合、エクスポーターは「ハード」になります。\n   *一時停止しました。\n   */\n---\n  /**\n   * エクスポーターがソフト一時停止されている場合、エクスポーターを更新せずにレコードのエクスポートを継続します。\n   *状態。再開すると、エクスポータは最後の位置とメタデータで更新されます。\n   * エクスポートされたレコード。\n   *\n   * <p>エクスポーターがハード一時停止されていて、softPauseExporting が呼び出された場合、エクスポーターはソフト一時停止になります。\n   *一時停止しました。\n   */\n---\n  /**\n   * この方法により、一時停止したレコードのエクスポートを再開できます。それは機能します\n   * 「ソフト一時停止」状態と「一時停止」状態の両方を再開します。再開すると、エクスポーターは\n   * 最後にエクスポートされたレコードの位置とメタデータで更新されます。\n   */\n---\n// 一時停止フェーズは、エクスポーターが一時停止されており、エクスポーターがレコードをエクスポートしていないときです。\n// SOFT_PAUSED フェーズでは、エクスポータの状態を更新せずにレコードのエクスポートを続けます。", "target_method": "  public ActorFuture<Void> stopAsync() {\n    return actor.close();\n  }", "issue": null}, {"index": 89, "label": "", "notes": "", "github_url": "https://github.com/hneemann/Digital/commit/118c66a79726f0d0634b763323c3f9ca91d7b51d", "repo": "hneemann/Digital", "commit_date": "2016-04-15", "commit_message": "added some documentation", "commit_message_ja": "いくつかのドキュメントを追加しました", "is_different_author": "-1", "time_gap_days": "", "file_path": "Pin.java", "target_class": "", "comment_type": "inline", "added_comment": " *\n---\n    /**\n     * Creates a new pin\n     *\n     * @param pos the position\n     * @param pin the PinDescription\n     */\n---\n    /**\n     * @return the pins position\n     */\n---\n    /**\n     * @return the value which represents the pin state\n     */\n---\n    /**\n     * Sets the value which represents the pins state\n     *\n     * @param value the ObservableValue\n     */\n---\n    /**\n     * If the pin is bidirectional there are two values, one which can be used to read the pins state\n     * and one to write the pins state. The readers value is generated so that all the writers are checked to\n     * find and select the one writer which is not in high Z state. If more then one writer is in an not high Z\n     * state an exception is thrown.\n     *\n     * @return returns the bidirectional reader\n     */\n---\n    /**\n     * Sets the bidirectional reader.\n     *\n     * @param readerValue the bidirectional reader\n     * @see Pin#getReaderValue()\n     */\n---\n     * Registers a new window.\n     * If an old window with the same id is found, its position and size is set to the new window.\n     * After that the old window is disposed.", "added_comment_ja": "*\n---\n    /**\n     * 新しいピンを作成します\n     *\n     * @param は位置を指定します\n     * @param PinDescription\n     */\n---\n    /**\n     * @return ピンの位置\n     */\n---\n    /**\n     * @return ピンの状態を表す値\n     */\n---\n    /**\n     * ピンの状態を表す値を設定します\n     *\n     * @param 値は ObservableValue\n     */\n---\n    /**\n     * ピンが双方向の場合は 2 つの値があり、1 つはピンの状態を読み取るために使用できます。\n     * とピンの状態を書き込むための 1 つ。すべてのライターがチェックされるように、リーダーの値が生成されます。\n     * 高 Z 状態ではないライターを 1 つ見つけて選択します。複数のライターが高くない Z にある場合\n     * 例外がスローされた状態。\n     *\n     * @return は双方向リーダーを返します\n     */\n---\n    /**\n     * 双方向リーダーを設定します。\n     *\n     * @param ReaderValue 双方向リーダー\n     * @Pin#getReaderValue() を参照\n     */\n---\n     ※新規ウィンドウを登録します。\n     ※同じIDを持つ古いウィンドウが見つかった場合、その位置とサイズは新しいウィンドウに設定されます。\n     ※その後、古いウィンドウは処分されます。", "target_method": "", "issue": null}, {"index": 90, "label": "", "notes": "", "github_url": "https://github.com/openjdk/jdk/commit/4ff5f3a8c0910e9ed9d77586bd692c469bdf3460 ps://github.com/puniverse/quasar/issues/160#issuecomment-205977756 を参照してください。", "target_method": "", "issue": null}, {"index": 92, "label": "", "notes": "", "github_url": "https://github.com/netty/netty/commit/55078d87bd7cc7f560c99f04f6e08dce977a0087", "repo": "netty/netty", "commit_date": "2009-12-29", "commit_message": "Documentation", "commit_message_ja": "ドキュメント", "is_different_author": "-1", "time_gap_days": "", "file_path": "ChannelHandlerContext.java", "target_class": "", "comment_type": "inline", "added_comment": " * <h3>Retrieving for later use</h3>\n *\n * You can keep the {@link ChannelHandlerContext} for later use, such as\n * triggering an event outside the handler methods, even from a different thread.\n * <pre>\n * public class MyHandler extends SimpleChannelHandler\n *                        implements LifeCycleAwareChannelHandler {\n *\n *     private ChannelHandlerContex ctx;\n *\n *     public void beforeAdd(ChannelHandlerContext ctx) {\n *         this.ctx = ctx;\n *     }\n *\n *     public void messageReceived(ChannelHandlerContext ctx, MessageEvent evt) {\n *         ctx.setAttachment(evt.getMessage());\n *     }\n *\n *     public Object getLastReceivedMessage() {\n *         return ctx.getAttachment();\n *     }\n *     ...\n * }\n * </pre>\n *\n---\n * might lead to an unexpected behavior.  It is because the context object\n * might not have been fully added to the pipeline or the context object is not\n * a part of the pipeline anymore respectively.", "added_comment_ja": "* <h3>後で使用するために取得します</h3>\n *\n * {@link ChannelHandlerContext} は、後で使用するために保存しておくこともできます。\n * ハンドラー メソッドの外で、別のスレッドからでもイベントをトリガーします。\n * <前>\n * パブリック クラス MyHandler は SimpleChannelHandler を拡張します\n * LifeCycleAwareChannelHandler を実装します {\n *\n * プライベート ChannelHandlerContex ctx;\n *\n * public void beforeAdd(ChannelHandlerContext ctx) {\n * this.ctx = ctx;\n * }\n *\n * public void messageReceived(ChannelHandlerContext ctx, MessageEvent evt) {\n * ctx.setAttachment(evt.getMessage());\n * }\n *\n * public Object getLastReceivedMessage() {\n * ctx.getAttachment() を返します。\n * }\n * ...\n * }\n * </pre>\n *\n---\n * 予期しない動作が発生する可能性があります。  それはコンテキストオブジェクトだからです\n * パイプラインに完全に追加されていないか、コンテキスト オブジェクトが正しく追加されていない可能性があります。\n * それぞれパイプラインの一部になりました。", "target_method": "", "issue": null}, {"index": 93, "label": "", "notes": "", "github_url": "https://github.com/google/ExoPlayer/commit/6aa792aad540a599b7c5f4ee28d759f470c4d1f7", "repo": "google/ExoPlayer", "commit_date": "2019-11-05", "commit_message": "Document error handling in the Extractor interface\n\nPiperOrigin-RevId: 276660235", "commit_message_ja": "Extractor インターフェイスでのドキュメント エラー処理\n\nPiperOrigin-RevId: 276660235", "is_different_author": "-1", "time_gap_days": "", "file_path": "Extractor.java", "target_class": "", "comment_type": "inline", "added_comment": "   * <p>When this method throws an {@link IOException} or an {@link InterruptedException},\n   * extraction may continue by providing an {@link ExtractorInput} with an unchanged {@link\n   * ExtractorInput#getPosition() read position} to a subsequent call to this method.\n   *", "added_comment_ja": "* <p>このメソッドが {@link IOException} または {@link InterruptedException} をスローした場合、\n   * 抽出は、変更されていない {@link を含む {@link ExtractorInput} を提供することで続行できます。\n   * ExtractorInput#getPosition() readposition} をこのメソッドの後続の呼び出しに渡します。\n   *", "target_method": "", "issue": null}, {"index": 94, "label": "", "notes": "", "github_url": "https://github.com/google/guava/commit/588ce172f1270a1a5267933fab5486a048e60025", "repo": "google/guava", "commit_date": "2019-08-16", "commit_message": "Add note about {@code ByteSource.wrap}'s use of the given byte array.\n\nFixes https://github.com/google/guava/issues/2603\n\nRELNOTES=n/a\n\n-------------\nCreated by MOE: https://github.com/google/moe\nMOE_MIGRATED_REVID=262439830", "commit_message_ja": "{@code ByteSource.wrap} による指定されたバイト配列の使用に関するメモを追加します。\n\n修正 https://github.com/google/guava/issues/2603\n\nRELNOTES=n/a\n\n-------------\n環境省作成：https://github.com/google/moe\nMOE_MIGRATED_REVID=262439830", "is_different_author": "-1", "time_gap_days": "", "file_path": "ByteSource.java", "target_class": "ByteSource", "comment_type": "inline", "added_comment": "   * <p>Note that the given byte array may be be passed directly to methods on, for example, {@code\n   * OutputStream} (when {@code copyTo(OutputStream)} is called on the resulting {@code\n   * ByteSource}). This could allow a malicious {@code OutputStream} implementation to modify the\n   * contents of the array, but provides better performance in the normal case.\n   *", "added_comment_ja": "* <p>指定されたバイト配列は、{@code などのメソッドに直接渡すことができることに注意してください。\n   * OutputStream} (結果の {@code に対して {@code copyTo(OutputStream)} が呼び出されたとき)\n   *バイトソース})。これにより、悪意のある {@code OutputStream} 実装によって、\n   * 配列の内容ですが、通常の場合のパフォーマンスが向上します。\n   *", "target_method": "  public static ByteSource concat(ByteSource... sources) {\n    return concat(ImmutableList.copyOf(sources));\n  }", "issue": null}, {"index": 95, "label": "", "notes": "", "github_url": "https://github.com/mockito/mockito/commit/cf5bd5f2bc26cd1da02a9006ff2b5e78ab1975a8", "repo": "mockito/mockito", "commit_date": "2016-09-08", "commit_message": "Fixed javadoc documentation in the main class\n\nWe don't need to repeat this information in the javadoc, it's on the wiki.", "commit_message_ja": "メインクラスの Javadoc ドキュメントを修正しました\n\nこの情報は javadoc で繰り返す必要はありません。情報は Wiki にあります。", "is_different_author": "-1", "time_gap_days": "", "file_path": "Mockito.java", "target_class": "", "comment_type": "inline", "added_comment": " *      <a href=\"#0\">0. Migrating to Mockito 2</a><br/>\n---\n * <h3 id=\"0\">0. <a class=\"meaningful_link\" href=\"#verification\">Migrating to Mockito 2</a></h3>\n---\n * For comprehensive information about the new release including incompatible changes,\n * see '<a href=\"https://github.com/mockito/mockito/wiki/What%27s-new-in-Mockito-2\">What's new in Mockito 2</a>' wiki page.\n * We hope tha         handlers.add(handler);\n            return this;\n        }", "issue": null}, {"index": 98, "label": "", "notes": "", "github_url": "https://github.com/SeleniumHQ/selenium/commit/fdef2472ddb27779edbd10b77fa9e9e7bc65139e", "repo": "SeleniumHQ/selenium", "commit_date": "2006-11-14", "commit_message": "Additional documentation for SeleneseAntTask\n\n\nr3568", "commit_message_ja": "SeleneseAntTask の追加ドキュメント\n\n\nr3568", "is_different_author": "-1", "time_gap_days": "", "file_path": "SeleneseAntTask.java", "target_class": "", "comment_type": "inline", "added_comment": " * <p>Use it like this (for example):<blockquote><code>\n * &lt;taskdef&nbsp;resource=\"selenium-ant.properties\"&gt;<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;&lt;classpath&gt;<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;pathelement&nbsp;location=\"selenium-server.jar\"/&gt;<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;&lt;/classpath&gt;<br/>\n * &lt;/taskdef&gt;<br/>\n * &lt;selenese&nbsp;<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;suite=\"c:\\absolute\\path\\to\\my\\HTMLSuite.html\"<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;browser=\"*firefox\"<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;results=\"c:\\absolute\\path\\to\\my\\results.html\"<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;multiWindow=\"true\"<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;timeoutInSeconds=\"900\"<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;startURL=\"http://www.google.com\"&nbsp;/&gt;</code></blockquote>\n *", "added_comment_ja": "* <p>次のように使用します (例):<blockquote><code>\n * &lt;taskdef&nbsp;resource=\"selenium-ant.properties\"&gt;<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;&lt;クラスパス&gt;<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&lt;pathelement&nbsp;location=\"selenium-server.jar\"/&gt;<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;&lt;/classpath&gt;<br/>\n * &lt;/taskdef&gt;<br/>\n * &lt;セレネーゼ&nbsp;<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;suite=\"c:\\absolute\\path\\to\\my\\HTMLSuite.html\"<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;ブラウザ=\"*Firefox\"<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;results=\"c:\\absolute\\path\\to\\my\\results.html\"<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;multiWindow=\"true\"<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;timeoutInSeconds=\"900\"<br/>\n * &nbsp;&nbsp;&nbsp;&nbsp;startURL=\"http://www.google.com\"&nbsp;/&gt;</code></blockquote>\n *", "target_method": "", "issue": null}, {"index": 99, "label": "", "notes": "", "github_url": "https://github.com/openjdk/jdk/commit/8225a5f58a62ddf4acbb879bfcb53cf7bfd8542f", "repo": "openjdk/jdk", "commit_date": "2024-09-26", "commit_message": "8340981: Update citations to \"Hacker's Delight\"\n\nReviewed-by: bpb, iris, liach, jwaters", "commit_message_ja": "8340981: 引用を「Hacker's Delight」に更新\n\nレビュー者: bpb、iris、liach、jwaters", "is_different_author": "-1", "time_gap_days": "", "file_path": "Integer.java", "target_class": "", "comment_type": "inline", "added_comment": " * Copyright (c) 1994, 2024, Oracle and/or its affiliates. All rights reserved.\n---\n * based on material from Henry S. Warren, Jr.'s <cite>Hacker's\n * Delight</cite>, (Addison Wesley, 2002) and <cite>Hacker's\n * Delight, Second Edition</cite>, (Pearson Education, 2013).\n---\n     * The Sheep And Goats (SAG) operation (see Hacker's Delight, Second Edition, section 7.7)\n---\n * Copyright (c) 1994, 2024, Oracle and/or its affiliates. All rights reserved.\n---\n * based on material from Henry S. Warren, Jr.'s <cite>Hacker's\n * Delight</cite>, (Addison Wesley, 2002) and <cite>Hacker's\n * Delight, Second Edition</cite>, (Pearson Education, 2013).\n---\n     * The Sheep And Goats (SAG) operation (see Hacker's Delight, Second Edition, section 7.7)", "added_comment_ja": "* 著作権 (c) 1994、2024、Oracle および/またはその関連会社。無断転載を禁じます。\n---\n * ヘンリー S. ウォーレン ジュニアの資料に基づく<引用>Hacker's\n * Delight</cite>、(Addison Wesley、2002) および <cite>Hacker's\n * Delight、第 2 版</cite>、(ピアソン エデュケーション、2013 年)。\n---\n     * The Sheep And Goats (SAG) オペレーション (Hacker's Delight、第 2 版、セクション 7.7 を参照)\n---\n * 著作権 (c) 1994、2024、Oracle および/またはその関連会社。無断転載を禁じます。\n---\n * ヘンリー S. ウォーレン ジュニアの資料に基づく<引用>Hacker's\n * Delight</cite>、(Addison Wesley、2002) および <cite>Hacker's\n * Delight、第 2 版</cite>、(ピアソン エデュケーション、2013 年)。\n---\n     * The Sheep And Goats (SAG) オペレーション (Hacker's Delight、第 2 版、セクション 7.7 を参照)", "target_method": "", "issue": null}, {"index": 100, "label": "", "notes": "", "github_url": "https://github.com/liquibase/liquibase/commit/6527ae59d6e3385a308e02efdbebd560496b4c3c", "repo": "liquibase/liquibase", "commit_date": "2019-08-14", "commit_message": "improve documentation", "commit_message_ja": "ドキュメントを改善する", "is_different_author": "-1", "time_gap_days": "", "file_path": "Location.java", "target_class": "", "comment_type": "inline", "added_comment": " * four LocationTypes in use. The FILE_PATH type is the most direct. The ENVIRONMENT_VARIABLE\n * and SYSTEM_PROPERTY types are things that can refer to a path. These three types eventually\n * lead to a path on the filesystem that can be used to get a file.\n * The fourth type is BASE64_STRING. For this type, the value is a BASE64 encoded string of a\n * license file.", "added_comment_ja": "* 4 つの LocationType が使用されています。 FILE_PATH タイプは最も直接的です。 ENVIRONMENT_VARIABLE\n * および SYSTEM_PROPERTY 型はパスを参照できるものです。最終的にはこの3種類\n * ファイルを取得するために使用できるファイルシステム上のパスにつながります。\n * 4 番目のタイプは BASE64_STRING です。この型の場合、値は BASE64 でエンコードされた文字列です。\n * ライセンスファイル。", "target_method": "", "issue": null}];
const TOTAL = ENTRIES.length;
const KEY = "annotation_v1";

function load() {
  try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch { return {}; }
}
function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }

function updateProgress() {
  const data = load();
  const done = Object.values(data).filter(v => v.label !== "").length;
  document.getElementById("progress-text").textContent = `${done} / ${TOTAL} 件完了`;
  document.getElementById("progress-fill").style.width = `${(done/TOTAL)*100}%`;
}

function setLabel(idx, val) {
  const data = load();
  if (!data[idx]) data[idx] = {label: "", notes: ""};
  data[idx].label = val;
  save(data);
  const btns = document.querySelectorAll(`#card-${idx} .label-btn`);
  btns.forEach(b => b.className = "label-btn");
  const map = {"1":"selected-1","0":"selected-0","?":"selected-q"};
  btns.forEach(b => { if (b.dataset.val === val) b.classList.add(map[val]); });
  updateProgress();
}

function setNotes(idx, val) {
  const data = load();
  if (!data[idx]) data[idx] = {label: "", notes: ""};
  data[idx].notes = val;
  save(data);
}

function toggleLang(idx, field) {
  const en = document.getElementById(`${field}-en-${idx}`);
  const ja = document.getElementById(`${field}-ja-${idx}`);
  if (!en || !ja) return;
  const showJa = en.style.display !== "none";
  en.style.display = showJa ? "none" : "";
  ja.style.display = showJa ? "" : "none";
}

function renderCards() {
  const data = load();
  const container = document.getElementById("cards");
  container.innerHTML = ENTRIES.map(e => {
    const saved = data[e.index] || {label: "", notes: ""};
    const labelMap = {"1":"selected-1","0":"selected-0","?":"selected-q"};
    function btnClass(v) { return "label-btn" + (saved.label === v ? " " + labelMap[v] : ""); }

    const diffAuthor = e.is_different_author == "1"
      ? `<span class="meta-item highlight">別著者が追加</span>` : "";
    const timeGap = e.time_gap_days
      ? `<span class="meta-item">${e.time_gap_days} 日後</span>` : "";

    const issueHtml = e.issue ? `
      <div class="section">
        <div class="section-label">
          関連 Issue #${e.issue.number}
          <a href="${e.issue.html_url}" target="_blank" style="margin-left:8px">GitHub で開く</a>
          <span class="lang-toggle" onclick="toggleLang(${e.index},'issue-title')">EN/JA</span>
        </div>
        <div class="issue-box">
          <div class="issue-title">
            <span id="issue-title-ja-${e.index}">${esc(e.issue.title_ja)}</span>
            <span id="issue-title-en-${e.index}" style="display:none">${esc(e.issue.title_en)}</span>
          </div>
          <div class="issue-body">
            <div id="issue-body-ja-${e.index}">${esc(e.issue.body_ja)}</div>
            <div id="issue-body-en-${e.index}" style="display:none">${esc(e.issue.body_en)}</div>
          </div>
        </div>
      </div>` : "";

    return `
    <div class="card" id="card-${e.index}">
      <div class="card-header">
        <span class="idx">#${e.index}</span>
        <span class="repo">${esc(e.repo)}</span>
        <span class="date">${esc(e.commit_date)}</span>
        <a href="${e.github_url}" target="_blank">diff を開く ↗</a>
      </div>
      <div class="card-body">
        <div class="section">
          <div class="section-label">
            コミットメッセージ
            <span class="lang-toggle" onclick="toggleLang(${e.index},'commit-msg')">EN/JA</span>
          </div>
          <div id="commit-msg-ja-${e.index}" class="commit-msg">${esc(e.commit_message_ja)}</div>
          <div id="commit-msg-en-${e.index}" class="commit-msg" style="display:none">${esc(e.commit_message)}</div>
        </div>
        <div class="meta-row" style="margin-bottom:10px">
          <span class="meta-item">${esc(e.comment_type)}</span>
          <span class="meta-item">${esc(e.file_path)}</span>
          ${timeGap}
          ${diffAuthor}
        </div>
        ${issueHtml}
        <div class="section">
          <div class="section-label">
            追加されたコメント
            <span class="lang-toggle" onclick="toggleLang(${e.index},'added-comment')">EN/JA</span>
          </div>
          <div id="added-comment-ja-${e.index}" class="added-comment">${esc(e.added_comment_ja)}</div>
          <div id="added-comment-en-${e.index}" class="added-comment" style="display:none">${esc(e.added_comment)}</div>
        </div>
        <div class="section">
          <div class="section-label">対象メソッド（${esc(e.target_class)}）</div>
          <pre>${esc(e.target_method)}</pre>
        </div>
      </div>
      <div class="label-row">
        <span>ラベル:</span>
        <button class="${btnClass("1")}" data-val="1" onclick="setLabel(${e.index},'1')">1 難解さ起因</button>
        <button class="${btnClass("0")}" data-val="0" onclick="setLabel(${e.index},'0')">0 非該当</button>
        <button class="${btnClass("?")}" data-val="?" onclick="setLabel(${e.index},'?')">? 不明</button>
        <input class="notes-input" type="text" placeholder="メモ（任意）"
               value="${esc(saved.notes)}"
               onchange="setNotes(${e.index}, this.value)">
      </div>
    </div>`;
  }).join("");
}

function esc(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
                      .replace(/"/g,"&quot;");
}

function exportCSV() {
  const data = load();
  const header = ["label","notes","github_url","repo","commit_date","commit_message",
                  "is_different_author","time_gap_days","file_path","target_class",
                  "comment_type","added_comment","target_method"];
  const rows = ENTRIES.map(e => {
    const saved = data[e.index] || {label:"",notes:""};
    return [saved.label, saved.notes, e.github_url, e.repo, e.commit_date,
            e.commit_message, e.is_different_author, e.time_gap_days,
            e.file_path, e.target_class, e.comment_type, e.added_comment, e.target_method]
      .map(v => `"${String(v||"").replace(/"/g,'""')}"`).join(",");
  });
  const blob = new Blob([header.join(",") + "\n" + rows.join("\n")], {type:"text/csv"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "labeled.csv";
  a.click();
}

renderCards();
updateProgress();
</script>
</body>
</html>
